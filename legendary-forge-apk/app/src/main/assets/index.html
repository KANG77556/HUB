alternate}@keyframes p{to{transform:scale(1.4);opacity:.35}}#card{position:absolute;left:50%;bottom:185px;transform:translateX(-50%);width:145px;background:#08121eea;border:2px solid #4aa6ff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 0 22px #247fea88}#card b{display:block;color:#65b8ff}#weapon{font-size:46px}#craft{position:absolute;left:18px;right:18px;bottom:91px;height:66px;border:2px solid #ffe4a0;border-radius:20px;background:linear-gradient(#ffd34e,#e77e0e);color:#4a2100;font-size:22px;font-weight:1000;box-shadow:0 0 24px #ff8b19aa}nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#130c08f2;border-top:1px solid #855021;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:7px}nav button{background:#28180e;border:1px solid #5e3b20;border-radius:12px;color:#e8d4b7;font-size:10px}nav button span{display:block;font-size:20px}.modal{display:none;position:absolute;z-index:20;inset:75px 12px 88px;background:#170e09fa;border:1px solid #b27633;border-radius:18px;padding:15px;overflow:auto}.modal.on{display:block}.modal h2{color:#ffd875;margin:0 0 12px}.row{background:#27170e;border:1px solid #64401f;border-radius:11px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.gold{background:#e28b17;color:#3b1900;border:0;border-radius:9px;padding:8px 12px;font-weight:800}#toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);background:#000d;padding:8px 13px;border-radius:20px;font-size:11px;opacity:0;transition:.2s;white-space:nowrap}#toast.on{opacity:1}small{color:#bfa98d}button{font:inherit}
</style></head><body><main id="app"><header><h1>전설의<br>대장간</h1><div class="res"><div class="pill">🪙 <b id="gold">0</b></div><div class="pill">💎 <b id="gem">50</b></div><div class="pill">⚡ <b id="sta">12</b>/12</div></div></header><section id="stage"><b id="lv">대장간 Lv.1</b><span style="float:right" id="power">전투력 100</span><div id="bar"><i style="width:12%"></i></div></section><aside id="orders"><h3>주문서</h3><div id="orderlist"></div></aside><section id="hero"><div id="anvil"><i id="spark">✦</i></div></section><section id="card"><b id="rarity">희귀</b><div id="weapon">⚔️</div><strong id="item">청풍검</strong><small id="value">가치 1.2K</small></section><button id="craft">⚒ 제작 시작</button><nav><button data-tab="home"><span>⚒</span>제작</button><button data-tab="orders"><span>📜</span>주문</button><button id="upgrade" data-tab="upgrade"><span>⬆️</span>강화</button><button id="staff" data-tab="staff"><span>🧑‍🏭</span>직원</button><button data-tab="shop"><span>🏪</span>상점</button></nav><section class="modal" id="panel"><button class="gold" style="float:right" id="close">닫기</button><div id="content"></div></section><div id="toast"></div></main><script>
const K='legendary-forge-apk-v1',R=['일반','고급','희귀','영웅','전설','신화'],C=[.55,.8,.92,.97,.995,1],M=[1,1.7,3,6,14,35];let D={gold:1200,gem:50,sta:12,max:12,lv:1,staff:0,auto:false,inv:[0,0,0,0,0,0],orders:[],crafts:0,last:Date.now()};try{D=Object.assign(D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){};function save(){D.last=Date.now();localStorage.setItem(K,JSON.stringify(D))}function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n)}function roll(){let x=Math.random();return C.findIndex(v=>x<=v)}function mkOrders(){while(D.orders.length<3){let r=Math.min(4,Math.floor(Math.random()*5)),q=1+(Math.random()*(r<2?3:2)|0);D.orders.push({r,q,p:Math.round(300*q*M[r]*(1+D.lv*.1))})}}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1200)}function render(){mkOrders();gold.textContent=fmt(D.gold);gem.textContent=D.gem;sta.textContent=D.sta;lv.textContent='대장간 Lv.'+D.lv;power.textContent='전투력 '+fmt(100*D.lv*(1+D.staff*.05));orderlist.innerHTML=D.orders.map((o,i)=>`<div class=ord><span>${R[o.r]} ×${o.q}</span><b>${D.inv[o.r]||0}/${o.q}</b></div>`).join('');save()}function doCraft(){if(D.sta<1)return toast('스태미나 부족');D.sta--;craft.disabled=true;craft.textContent='제작 중...';setTimeout(()=>{let r=roll(),v=Math.round(200*D.lv*(1+D.staff*.05)*M[r]);D.gold+=v;D.inv[r]++;D.crafts++;rarity.textContent=R[r];value.textContent='가치 '+fmt(v);weapon.textContent=['🗡️','⚔️','🗡️','⚔️','🔥⚔️','🌋⚔️'][r];craft.disabled=false;craft.textContent='⚒ 제작 시작';toast(R[r]+' 장비 제작 +'+fmt(v));render();if(D.auto)setTimeout(doCraft,500)},Math.max(500,1600-D.staff*60))}function ordersUI(){content.innerHTML='<h2>주문</h2>'+D.orders.map((o,i)=>`<div class=row><span>${R[o.r]} 장비 ×${o.q}<br><small>보유 ${D.inv[o.r]||0} · 보상 ${fmt(o.p)}G</small></span><button class=gold onclick="claim(${i})">납품</button></div>`).join('')}function claim(i){let o=D.orders[i];if(D.inv[o.r]<o.q)return toast('장비 부족');D.inv[o.r]-=o.q;D.gold+=o.p;D.orders.splice(i,1);ordersUI();render();toast('주문 완료')}function upgradeUI(){let c=Math.round(800*Math.pow(1.32,D.lv-1));content.innerHTML=`<h2>강화</h2><div class=row><span>대장간 Lv.${D.lv}<br><small>제작 수익 증가</small></span><button class=gold onclick="up(${c})">${fmt(c)}G 강화</button></div>`}function up(c){if(D.gold<c)return toast('골드 부족');D.gold-=c;D.lv++;upgradeUI();render()}function staffUI(){let c=Math.round(1500*Math.pow(1.45,D.staff));content.innerHTML=`<h2>직원</h2><div class=row><span>조수 Lv.${D.staff}<br><small>속도·수익 보너스</small></span><button class=gold onclick="hire(${c})">${fmt(c)}G 고용</button></div><div class=row><span>자동 제작</span><button class=gold onclick="auto()">${D.auto?'ON':'OFF'}</button></div>`}function hire(c){if(D.gold<c)return toast('골드 부족');D.gold-=c;D.staff=Math.min(20,D.staff+1);staffUI();render()}function auto(){if(!D.staff)return toast('직원 Lv.1 필요');D.auto=!D.auto;staffUI();save();if(D.auto&&!craft.disabled)doCraft()}function shopUI(){content.innerHTML='<h2>상점</h2><div class=row><span>무료 보상</span><button class=gold onclick="reward()">받기</button></div>'}function reward(){D.gold+=500*D.lv;render();toast('무료 보상 +'+fmt(500*D.lv))}function open(t){if(t==='home')return panel.classList.remove('on');panel.classList.add('on');({orders:ordersUI,upgrade:upgradeUI,staff:staffUI,shop:shopUI}[t]||ordersUI)()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>open(b.dataset.tab));close.onclick=()=>panel.classList.remove('on');craft.onclick=doCraft;let sec=Math.min(28800,Math.max(0,(Date.now()-D.last)/1000));if(sec>20){let g=Math.floor(sec/5*20*D.lv*(1+D.staff*.05));D.gold+=g;setTimeout(()=>toast('오프라인 보상 +'+fmt(g)+'G'),400)}render();setInterval(()=>{if(D.sta<D.max)D.sta++;render()},30000);window.onbeforeunload=save;
</script></body></html>
