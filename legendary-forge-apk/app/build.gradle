plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seongho.legendaryforge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.seongho.legendaryforge'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
