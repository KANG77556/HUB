services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolworkhub
      POSTGRES_USER: schoolworkhub
      POSTGRES_PASSWORD: schoolworkhub-dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolworkhub -d schoolworkhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - schoolworkhub-postgres:/var/lib/postgresql/data

volumes:
  schoolworkhub-postgres:
