name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
      - 'com2-deploy/**'
      - 'fold8-deploy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Locate Android build environment
        shell: cmd
        run: |
          echo ANDROID_ENV_PROBE
          if exist "C:\actions-runner\runner-02\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-8\x64\bin\java.exe" echo JAVA17_OK=True
          if exist "C:\actions-runner\runner-03\_work\_tool\android-sdk-36" echo SDK36_OK=True
          echo GRADLE_SEARCH_BEGIN
          where /r C:\actions-runner gradle.bat 2>nul
          echo GRADLE_SEARCH_END
          echo SDK_TOOLS_BEGIN
          dir /b "C:\actions-runner\runner-03\_work\_tool\android-sdk-36\platforms" 2>nul
          dir /b "C:\actions-runner\runner-03\_work\_tool\android-sdk-36\build-tools" 2>nul
          echo SDK_TOOLS_END
          exit /b 0
