name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Probe runner and COM2 prerequisites
        shell: cmd
        run: |
          echo COM2_RUNNER_PROBE_OK
          echo MACHINE=%COMPUTERNAME%
          if exist "G:\내 드라이브\03_프로그램개발\COM2DevServer\JavaRuntime\dist\COM2DevServer-1.0.1-reproducible.jar" (echo JAR_EXISTS=True) else (echo JAR_EXISTS=False)
          if exist "G:\내 드라이브\03_프로그램개발\COM2DevServer\JavaRuntime\scripts\windows\complete_install_and_cutover_v2.ps1" (echo CUTOVER_EXISTS=True) else (echo CUTOVER_EXISTS=False)
          if exist "%LOCALAPPDATA%\ChatGPTMcpBridge\tunnel\chatgpt-bridge.yaml" (echo TUNNEL_CONFIG_EXISTS=True) else (echo TUNNEL_CONFIG_EXISTS=False)
          where java.exe >nul 2>&1 && (echo JAVA_ON_PATH=True & java.exe -version) || echo JAVA_ON_PATH=False
