name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect COM2 process metadata
        shell: cmd
        run: |
          echo COM2_RUNNER_PROBE_OK
          echo MCP_BRIDGE_PROCESS_BEGIN
          wmic process where "name='ChatGPT MCP Bridge.exe'" get ProcessId,ExecutablePath,CommandLine /format:list 2>nul
          echo MCP_BRIDGE_PROCESS_END
          echo TUNNEL_PROCESS_BEGIN
          wmic process where "name='tunnel-client.exe'" get ProcessId,ExecutablePath,CommandLine /format:list 2>nul
          echo TUNNEL_PROCESS_END
          tasklist /v /fi "imagename eq ChatGPT MCP Bridge.exe"
          tasklist /v /fi "imagename eq tunnel-client.exe"
          exit /b 0
