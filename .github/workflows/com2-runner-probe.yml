name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
      - 'com2-deploy/**'
      - 'fold8-deploy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Locate Gradle 9.1 cache
        shell: cmd
        run: |
          echo GRADLE_91_PROBE
          if exist "C:\Users\USER\.gradle\wrapper\dists\gradle-9.1.0-all\f36z46sifdyepuwewyafe5rwl\gradle-9.1.0\bin\gradle.bat" echo GRADLE91_KNOWN=True
          echo GRADLE_USER_SEARCH_BEGIN
          for /r "C:\Users\USER\.gradle\wrapper\dists" %%F in (gradle.bat) do @echo %%F
          echo GRADLE_USER_SEARCH_END
          exit /b 0
