name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Probe local deployment paths
        shell: cmd
        run: |
          echo COM2_RUNNER_PROBE_OK
          echo MACHINE=%COMPUTERNAME%
          echo USERPROFILE=%USERPROFILE%
          whoami
          for %%P in ("C:\Users\USER\AppData\Local\ChatGPTMcpBridge\tunnel\chatgpt-bridge.yaml" "C:\Users\1\AppData\Local\ChatGPTMcpBridge\tunnel\chatgpt-bridge.yaml") do @if exist %%~P (echo TUNNEL_CONFIG=%%~P)
          for %%J in ("C:\actions-runner\runner-02\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-8\x64\bin\java.exe" "C:\actions-runner\runner-03\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-8\x64\bin\java.exe" "C:\Program Files\Java\jdk-17\bin\java.exe") do @if exist %%~J (echo JAVA17=%%~J)
          if exist "C:\Users\USER\Fold8Launcher" echo FOLD8_USER_EXISTS=True
          if exist "C:\Users\1\Fold8Launcher" echo FOLD8_1_EXISTS=True
          if exist "C:\Users\USER\ChatGPT-Workspace" echo WORKSPACE_USER_EXISTS=True
          if exist "C:\Users\1\ChatGPT-Workspace" echo WORKSPACE_1_EXISTS=True
          exit /b 0
