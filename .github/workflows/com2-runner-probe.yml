name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
      - 'com2-deploy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify persisted COM2 sidecar
        shell: cmd
        run: |
          echo COM2_PERSISTENCE_PROBE
          curl.exe -fsS http://127.0.0.1:8767/healthz | findstr /x "ok" >nul || exit /b 31
          > "%RUNNER_TEMP%\tools-req.json" echo {"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}
          curl.exe -fsS -H "Content-Type: application/json" --data-binary @"%RUNNER_TEMP%\tools-req.json" http://127.0.0.1:8767/mcp | findstr /c:"\"name\":\"get_file_hash\"" >nul || exit /b 32
          echo COM2_PERSISTED_OK
