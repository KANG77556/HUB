name: COM2 Runner Probe

on:
  push:
    branches: [com2-runner-probe-20260824]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/com2-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Locate user-scoped COM2 assets
        shell: cmd
        run: |
          echo COM2_RUNNER_PROBE_OK
          echo MACHINE=%COMPUTERNAME%
          echo USERPROFILES_BEGIN
          dir /b /ad C:\Users 2>nul
          echo USERPROFILES_END
          echo TUNNEL_SEARCH_BEGIN
          dir /s /b C:\Users\chatgpt-bridge.yaml 2>nul
          echo TUNNEL_SEARCH_END
          echo FOLD8_SEARCH_BEGIN
          dir /s /b /ad C:\Users\Fold8Launcher 2>nul
          echo FOLD8_SEARCH_END
          echo WORKSPACE_SEARCH_BEGIN
          dir /s /b /ad C:\Users\ChatGPT-Workspace 2>nul
          echo WORKSPACE_SEARCH_END
          tasklist /fi "imagename eq ChatGPT MCP Bridge.exe"
          tasklist /fi "imagename eq tunnel-client.exe"
          tasklist /fi "imagename eq cloudflared.exe"
          exit /b 0
