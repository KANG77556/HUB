name: Teacher Client CI

on:
  push:
    paths:
      - "apps/teacher-client/**"
      - ".github/workflows/teacher-client-ci.yml"
  pull_request:
    paths:
      - "apps/teacher-client/**"
      - ".github/workflows/teacher-client-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/teacher-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/teacher-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
