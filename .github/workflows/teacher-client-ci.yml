name: Teacher Client CI

on:
  push:
    paths:
      - "apps/teacher-client/**"
      - ".github/workflows/teacher-client-ci.yml"
  pull_request:
    paths:
      - "apps/teacher-client/**"
      - ".github/workflows/teacher-client-ci.yml"

permissions:
  contents: read

jobs:
  ubuntu-verify:
    name: Ubuntu static and foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/teacher-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/teacher-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI fixture runtime
        run: python -m pip install "fastapi>=0.115,<1.0" "uvicorn>=0.34,<1.0"
      - name: Install
        run: npm ci
      - name: Install Vitest coverage provider
        run: npm install --no-save --package-lock=false --ignore-scripts @vitest/coverage-v8@4.1.10
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test with coverage
        run: npm test -- --coverage
      - name: Build
        run: npm run build

  windows-native:
    name: Windows native security
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/teacher-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/teacher-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI fixture runtime
        run: python -m pip install "fastapi>=0.115,<1.0" "uvicorn>=0.34,<1.0"
      - name: Install
        run: npm ci
      - name: Rebuild native modules
        run: npm run rebuild:native
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Sandboxed preload and IPC smoke
        run: npx electron dist/electron/main/scripts/windowsRuntimeSmoke.js
      - name: Windows Credential Manager and DPAPI smoke
        run: npx electron dist/electron/main/scripts/windowsSecuritySmoke.js
      - name: Produce foundation verification report
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-foundation.ps1
