name: Verify Document Editing PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/document-editing-pr.yml'
      - 'android-source/**'

permissions:
  contents: read

concurrency:
  group: document-editing-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  editing-contract:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Verify document editing contract
        run: call android-source\scripts\test-document-editing.cmd

  editor-supply-chain-probe:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Hash RHWP editor package
        run: |
          setlocal EnableDelayedExpansion
          set "TMP=%RUNNER_TEMP%\rhwp-editor-probe"
          if exist "!TMP!" rmdir /s /q "!TMP!"
          mkdir "!TMP!"
          set "NPM_CONFIG_STRICT_SSL=false"
          call npm pack @rhwp/editor@0.8.4 --pack-destination "!TMP!"
          for %%F in ("!TMP!\*.tgz") do set "EDITOR_TGZ=%%~fF"
          if not defined EDITOR_TGZ exit /b 31
          echo === RHWP_EDITOR_TGZ_SHA256 ===
          certutil -hashfile "!EDITOR_TGZ!" SHA256
          echo RHWP_STUDIO_COMMIT=496333b27d21ddb9114ba9ae340bcb895870c9a7
