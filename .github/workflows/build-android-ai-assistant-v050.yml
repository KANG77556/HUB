name: Build Android AI Assistant v0.5.0 APK

on:
  push:
    branches:
      - apk-build-v0.5.0-public
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore Android project
        run: |
          mkdir -p workspace
          cat source/chunk-00.b64 source/chunk-01.b64 source/chunk-02.b64 source/chunk-03.b64 source/tail-*.b64 | base64 -d > /tmp/android-app-v0.5.0.zip
          echo 'b81f78382cf7066f08042c39ceb4104f1ab5fd54e7d49b3000d0c364428ef022  /tmp/android-app-v0.5.0.zip' | sha256sum -c -
          unzip -q /tmp/android-app-v0.5.0.zip -d workspace

      - name: Run Android unit tests
        working-directory: workspace/android-app
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: workspace/android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f workspace/android-app/app/build/outputs/apk/debug/app-debug.apk
          cp workspace/android-app/app/build/outputs/apk/debug/app-debug.apk Android-AI-Assistant-v0.5.0-debug.apk
          sha256sum Android-AI-Assistant-v0.5.0-debug.apk | tee APK-SHA256.txt
          ls -lh Android-AI-Assistant-v0.5.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AI-Assistant-v0.5.0-debug
          path: |
            Android-AI-Assistant-v0.5.0-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
