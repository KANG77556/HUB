name: Build Android AI Assistant v0.7.0

on:
  push:
    branches: [apk-build-v0.7.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore and verify v0.7.0 source
        run: |
          cat source-v07/part-*.b64 | tr -d '[:space:]' | base64 -d > /tmp/android-ai-assistant-v0.7.0.tar.xz
          echo '8b1a24932de2f406ebb9ea439ae79d145cf6eb64ee8692722b27add9d3ee0a16  /tmp/android-ai-assistant-v0.7.0.tar.xz' | sha256sum -c -
          mkdir -p workspace
          tar -xJf /tmp/android-ai-assistant-v0.7.0.tar.xz -C workspace
          python3 - <<'PY'
          from pathlib import Path
          path = Path('workspace/android-ai-assistant/android-app/app/src/main/java/kr/co/assistant/localai/model/LocalModelManager.kt')
          source = path.read_text()
          old = 'preferences.getString(KEY_WORK_ID, null)?.let { runCatching(UUID::fromString).getOrNull() } ?: return null'
          new = 'preferences.getString(KEY_WORK_ID, null)?.let { value -> runCatching { UUID.fromString(value) }.getOrNull() } ?: return null'
          assert old in source
          path.write_text(source.replace(old, new))
          PY

      - name: Run Android unit tests
        working-directory: workspace/android-ai-assistant/android-app
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: workspace/android-ai-assistant/android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK='workspace/android-ai-assistant/android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Android-AI-Assistant-v0.7.0-model-safe-debug.apk
          sha256sum Android-AI-Assistant-v0.7.0-model-safe-debug.apk | tee Android-AI-Assistant-v0.7.0-model-safe-debug-SHA256.txt
          ls -lh Android-AI-Assistant-v0.7.0-model-safe-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AI-Assistant-v0.7.0-model-safe-debug
          path: |
            Android-AI-Assistant-v0.7.0-model-safe-debug.apk
            Android-AI-Assistant-v0.7.0-model-safe-debug-SHA256.txt
          if-no-files-found: error
          retention-days: 7
