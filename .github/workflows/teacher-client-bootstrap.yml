name: Teacher Client Bootstrap

on:
  push:
    paths:
      - ".github/workflows/teacher-client-bootstrap.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/teacher-client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/teacher-client/package-lock.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/teacher-client/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore: lock teacher client dependencies"
            git push origin HEAD:feat/bootstrap-foundation
          fi
