name: API CI

on:
  push:
    paths:
      - "services/api-server/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "services/api-server/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolworkhub_test
          POSTGRES_USER: schoolworkhub
          POSTGRES_PASSWORD: schoolworkhub-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolworkhub -d schoolworkhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWH_DATABASE_URL: postgresql+asyncpg://schoolworkhub:schoolworkhub-test@127.0.0.1:5432/schoolworkhub_test
      SWH_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      SWH_ENVIRONMENT: test
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-server/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Migrate database
        run: alembic upgrade head
      - name: Diagnose lint
        run: |
          ruff check src/schoolworkhub/routers/admin.py --fix
          git diff -- src/schoolworkhub/routers/admin.py
          git diff --exit-code -- src/schoolworkhub/routers/admin.py
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=schoolworkhub --cov-report=term-missing
