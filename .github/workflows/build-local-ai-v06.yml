name: Build Android Local AI Assistant v0.6.0 APK

on:
  push:
    branches:
      - apk-build-v0.6.0-public
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore and verify Android project
        run: |
          mkdir -p workspace
          for file in source-v06/part-{00..07}.b64; do
            printf '%s ' "$file"
            tr -d '[:space:]' < "$file" | sha256sum | cut -d' ' -f1
          done
          cat source-v06/part-{00..07}.b64 | tr -d '[:space:]' | base64 -d > /tmp/android-app-v0.6.0.zip
          echo '92a22d23201b2fbb9101af95d99f388f56c85a068666a4d079e494454f25eecf  /tmp/android-app-v0.6.0.zip' | sha256sum -c -
          unzip -q /tmp/android-app-v0.6.0.zip -d workspace

      - name: Run Android unit tests
        working-directory: workspace/android-app
        run: gradle --no-daemon testDebugUnitTest

      - name: Build local AI debug APK
        working-directory: workspace/android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK='workspace/android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Android-AI-Assistant-v0.6.0-local-ai-debug.apk
          sha256sum Android-AI-Assistant-v0.6.0-local-ai-debug.apk | tee APK-SHA256.txt
          ls -lh Android-AI-Assistant-v0.6.0-local-ai-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AI-Assistant-v0.6.0-local-ai-debug
          path: |
            Android-AI-Assistant-v0.6.0-local-ai-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
