name: Build Android Local AI Assistant v0.6.0 APK

on:
  push:
    branches:
      - apk-build-v0.6.0-public
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Repair, restore and verify Android project
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          encoded = ''.join(
              Path(f'source-v06/repair-{index:02d}.b64').read_text().split()
              for index in range(3)
          )
          compressed = base64.b64decode(encoded)
          assert hashlib.sha256(compressed).hexdigest() == '13e5266b23dcf613dae6bf7d4445b0bdb8ef1079bbc13c14098af8f6b630305e'
          patch = json.loads(zlib.decompress(compressed))

          for key, spec in patch.items():
              path = Path(f'source-v06/part-{key}.b64')
              current = ''.join(path.read_text().split())
              assert hashlib.sha256(current.encode()).hexdigest() == spec['remote_sha'], key
              for start, end, replacement in reversed(spec['ops']):
                  current = current[:start] + replacement + current[end:]
              assert hashlib.sha256(current.encode()).hexdigest() == spec['target_sha'], key
              path.write_text(current)
          PY

          mkdir -p workspace
          cat source-v06/part-{00..07}.b64 | tr -d '[:space:]' | base64 -d > /tmp/android-app-v0.6.0.zip
          echo '92a22d23201b2fbb9101af95d99f388f56c85a068666a4d079e494454f25eecf  /tmp/android-app-v0.6.0.zip' | sha256sum -c -
          unzip -q /tmp/android-app-v0.6.0.zip -d workspace

      - name: Run Android unit tests
        working-directory: workspace/android-app
        run: gradle --no-daemon testDebugUnitTest

      - name: Build local AI debug APK
        working-directory: workspace/android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK='workspace/android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Android-AI-Assistant-v0.6.0-local-ai-debug.apk
          sha256sum Android-AI-Assistant-v0.6.0-local-ai-debug.apk | tee APK-SHA256.txt
          ls -lh Android-AI-Assistant-v0.6.0-local-ai-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AI-Assistant-v0.6.0-local-ai-debug
          path: |
            Android-AI-Assistant-v0.6.0-local-ai-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
