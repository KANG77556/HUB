name: Build All Documents APK

on:
  push:
    branches: [main, build/all-documents-android]
    paths:
      - '.github/workflows/build-all-documents-apk.yml'
      - 'android-source/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-all-documents-apk.yml'
      - 'android-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-documents-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
      - name: Discover and configure Java 17
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PATH=$env:PATH"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "ProgramFiles=$env:ProgramFiles"
          Write-Host "ProgramFilesX86=${env:ProgramFiles(x86)}"
          Write-Host "LOCALAPPDATA=$env:LOCALAPPDATA"
          Write-Host "USERPROFILE=$env:USERPROFILE"

          where.exe java 2>$null | ForEach-Object { Write-Host "WHERE_JAVA=$_" }
          where.exe javac 2>$null | ForEach-Object { Write-Host "WHERE_JAVAC=$_" }
          where.exe winget 2>$null | ForEach-Object { Write-Host "WHERE_WINGET=$_" }
          where.exe choco 2>$null | ForEach-Object { Write-Host "WHERE_CHOCO=$_" }

          $direct = @(
            'C:\Program Files\Android\Android Studio\jbr',
            'C:\Program Files\Android\Android Studio\jre',
            'C:\Program Files\Eclipse Adoptium',
            'C:\Program Files\Java',
            'C:\Program Files\Microsoft',
            'C:\Program Files\Zulu',
            'C:\Program Files\BellSoft',
            'C:\Program Files (x86)\Java',
            'C:\ProgramData\chocolatey',
            'C:\tools',
            'C:\actions-runner',
            $env:LOCALAPPDATA,
            $env:USERPROFILE
          ) | Where-Object { $_ -and (Test-Path $_) }

          $javaFiles = New-Object System.Collections.Generic.List[string]
          foreach ($root in $direct | Select-Object -Unique) {
            Write-Host "SEARCH_ROOT=$root"
            try {
              Get-ChildItem -Path $root -Filter java.exe -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 20 | ForEach-Object { $javaFiles.Add($_.FullName) }
            } catch {
              Write-Host "SEARCH_WARN=$root :: $($_.Exception.Message)"
            }
          }

          $javaHome = $null
          foreach ($java in $javaFiles | Select-Object -Unique) {
            $version = (& $java -version 2>&1 | Select-Object -First 1 | Out-String).Trim()
            Write-Host "JAVA_FOUND=$java :: $version"
            if ($version -match '17') {
              $javaHome = Split-Path (Split-Path $java -Parent) -Parent
              break
            }
          }

          if (-not $javaHome) {
            Write-Host 'JAVA17_NOT_FOUND=true'
            throw 'Java 17 was not found after expanded runner scan.'
          }

          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $javaHome 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "JAVA_HOME_SELECTED=$javaHome"
      - name: Verify Java
        run: |
          $ErrorActionPreference = 'Stop'
          java -version
          $version = (& java -version 2>&1 | Select-Object -First 1 | Out-String)
          if ($version -notmatch '17') { throw "Java 17 is required. Found: $version" }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare source
        run: |
          if (-not (Test-Path 'android-source/app')) { throw 'android-source/app not found' }
          if (Test-Path 'all-documents-android') { Remove-Item 'all-documents-android' -Recurse -Force }
          Copy-Item 'android-source' 'all-documents-android' -Recurse -Force
      - name: Vendor RHWP browser runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'rhwp-runtime'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          npm pack '@rhwp/core@0.8.4' --pack-destination $tmp
          $pkg = Get-ChildItem $tmp -Filter '*.tgz' | Select-Object -First 1
          if (-not $pkg) { throw 'RHWP npm package was not created' }
          tar -xzf $pkg.FullName -C $tmp
          $js = Get-ChildItem (Join-Path $tmp 'package') -Recurse -Filter 'rhwp.js' | Select-Object -First 1
          $wasm = Get-ChildItem (Join-Path $tmp 'package') -Recurse -Filter 'rhwp_bg.wasm' | Select-Object -First 1
          if (-not $js -or -not $wasm) { throw 'RHWP JS/WASM assets not found' }
          $dest = 'all-documents-android/app/src/main/assets/rhwp-viewer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $js.FullName (Join-Path $dest 'rhwp.js') -Force
          Copy-Item $wasm.FullName (Join-Path $dest 'rhwp_bg.wasm') -Force
      - name: Build debug APK
        working-directory: all-documents-android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and RHWP runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = 'all-documents-android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apk) -or (Get-Item $apk).Length -eq 0) { throw 'APK was not created' }
          $verifyDir = Join-Path $env:RUNNER_TEMP 'apk-verify'
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          Expand-Archive -Path $apk -DestinationPath $verifyDir -Force
          @('assets/rhwp-viewer/index.html','assets/rhwp-viewer/rhwp.js','assets/rhwp-viewer/rhwp_bg.wasm') | ForEach-Object {
            if (-not (Test-Path (Join-Path $verifyDir $_))) { throw "APK missing $_" }
          }
          Write-Host ((Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant())
      - uses: actions/upload-artifact@v4
        with:
          name: all-documents-debug-apk
          path: all-documents-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
