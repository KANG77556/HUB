name: Build All Documents APK

on:
  push:
    branches: [build/all-documents-android]
    paths:
      - 'all-documents-android.tar.gz.b64'
      - '.github/workflows/build-all-documents-apk.yml'
      - 'android-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-documents-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source
        run: |
          rm -rf all-documents-android
          mkdir -p all-documents-android
          base64 -d all-documents-android.tar.gz.b64 > /tmp/app.tar.gz
          tar -xzf /tmp/app.tar.gz -C all-documents-android
      - name: Prefer maintained expanded source
        run: |
          if [ -d android-source/app ]; then
            rm -rf all-documents-android
            cp -a android-source all-documents-android
          fi
      - name: Publish expanded source early
        run: |
          if [ ! -d android-source/app ]; then
            rm -rf android-source
            cp -a all-documents-android android-source
            rm -rf android-source/.gradle android-source/app/build android-source/build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android-source
            git commit -m "build: publish expanded Android source [skip ci]"
            git push
          fi
      - name: Vendor rhwp browser runtime
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          npm pack @rhwp/core@0.8.2 --pack-destination "$TMP_DIR"
          PKG="$(find "$TMP_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$PKG"
          tar -xzf "$PKG" -C "$TMP_DIR"
          JS="$(find "$TMP_DIR/package" -type f -name 'rhwp.js' -print -quit)"
          WASM="$(find "$TMP_DIR/package" -type f -name 'rhwp_bg.wasm' -print -quit)"
          test -s "$JS"
          test -s "$WASM"
          DEST="all-documents-android/app/src/main/assets/rhwp-viewer"
          mkdir -p "$DEST"
          cp "$JS" "$DEST/rhwp.js"
          cp "$WASM" "$DEST/rhwp_bg.wasm"
          test -s "$DEST/rhwp.js"
          test -s "$DEST/rhwp_bg.wasm"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test domain
        working-directory: all-documents-android
        run: bash scripts/test-domain.sh
      - name: Build debug APK
        working-directory: all-documents-android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and rhwp runtime
        run: |
          set -euo pipefail
          APK=all-documents-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/rhwp-viewer/rhwp.js'
          unzip -l "$APK" | grep -q 'assets/rhwp-viewer/rhwp_bg.wasm'
          sha256sum "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-documents-debug-apk
          path: all-documents-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest APK
        run: |
          mkdir -p downloads
          cp all-documents-android/app/build/outputs/apk/debug/app-debug.apk downloads/all-documents-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/all-documents-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "build: publish latest all documents APK [skip ci]"
            git push
          fi
