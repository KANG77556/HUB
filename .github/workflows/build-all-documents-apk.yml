name: Build All Documents APK

on:
  push:
    branches: [main, build/all-documents-android]
    paths:
      - '.github/workflows/build-all-documents-apk.yml'
      - 'android-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-documents-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare source
        run: |
          if (-not (Test-Path 'android-source/app')) { throw 'android-source/app not found' }
          if (Test-Path 'all-documents-android') { Remove-Item 'all-documents-android' -Recurse -Force }
          Copy-Item 'android-source' 'all-documents-android' -Recurse -Force

      - name: Vendor RHWP browser runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'rhwp-runtime'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          npm pack '@rhwp/core@0.8.4' --pack-destination $tmp
          $pkg = Get-ChildItem $tmp -Filter '*.tgz' | Select-Object -First 1
          if (-not $pkg) { throw 'RHWP npm package was not created' }
          tar -xzf $pkg.FullName -C $tmp
          $js = Get-ChildItem (Join-Path $tmp 'package') -Recurse -Filter 'rhwp.js' | Select-Object -First 1
          $wasm = Get-ChildItem (Join-Path $tmp 'package') -Recurse -Filter 'rhwp_bg.wasm' | Select-Object -First 1
          if (-not $js -or -not $wasm) { throw 'RHWP JS/WASM assets not found' }
          $dest = 'all-documents-android/app/src/main/assets/rhwp-viewer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $js.FullName (Join-Path $dest 'rhwp.js') -Force
          Copy-Item $wasm.FullName (Join-Path $dest 'rhwp_bg.wasm') -Force
          @('index.html','rhwp.js','rhwp_bg.wasm') | ForEach-Object {
            $p = Join-Path $dest $_
            if (-not (Test-Path $p) -or (Get-Item $p).Length -eq 0) { throw "Missing RHWP asset: $_" }
          }

      - name: Verify internal-only viewer contract
        run: |
          $viewer = Get-Content 'all-documents-android/app/src/main/java/kr/co/alldocuments/ui/DocumentViewer.kt' -Raw
          $strategy = Get-Content 'all-documents-android/app/src/main/java/kr/co/alldocuments/domain/DocumentViewerStrategy.kt' -Raw
          $office = Get-Content 'all-documents-android/app/src/main/java/kr/co/alldocuments/ui/InternalOfficePreview.kt' -Raw
          if ($viewer -match 'ACTION_VIEW|외부 앱으로 열기') { throw 'External-app viewer path still exists' }
          @('TextOverflow.Ellipsis','maxLines = 1') | ForEach-Object { if ($viewer -notmatch [regex]::Escape($_)) { throw "Missing viewer UI contract: $_" } }
          @('ViewerKind.OFFICE','docx','xlsx','pptx') | ForEach-Object { if ($strategy -notmatch [regex]::Escape($_)) { throw "Missing office strategy contract: $_" } }
          @('ZipInputStream','word/document.xml','xl/sharedStrings.xml','ppt/slides/slide') | ForEach-Object { if ($office -notmatch [regex]::Escape($_)) { throw "Missing office preview contract: $_" } }
          Write-Host 'Internal-only viewer contract passed'

      - name: Build debug APK
        working-directory: all-documents-android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and RHWP runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = 'all-documents-android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apk) -or (Get-Item $apk).Length -eq 0) { throw 'APK was not created' }
          $verifyDir = Join-Path $env:RUNNER_TEMP 'apk-verify'
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          Expand-Archive -Path $apk -DestinationPath $verifyDir -Force
          @('assets/rhwp-viewer/index.html','assets/rhwp-viewer/rhwp.js','assets/rhwp-viewer/rhwp_bg.wasm') | ForEach-Object {
            if (-not (Test-Path (Join-Path $verifyDir $_))) { throw "APK missing $_" }
          }
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "APK SHA256=$hash"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-documents-debug-apk
          path: all-documents-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK and verification report
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = 'all-documents-android/app/build/outputs/apk/debug/app-debug.apk'
          New-Item -ItemType Directory -Force -Path 'downloads' | Out-Null
          Copy-Item $apk 'downloads/all-documents-debug.apk' -Force
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $apk).Length
          @"
          status=PASS
          source_commit=$env:GITHUB_SHA
          workflow_run=$env:GITHUB_RUN_ID
          apk_sha256=$hash
          apk_size=$size
          rhwp_index=PASS
          rhwp_js=PASS
          rhwp_wasm=PASS
          internal_viewer=PASS
          assemble_debug=PASS
          zip_integrity=PASS
          "@.Trim() | Set-Content 'downloads/build-verification.txt' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/all-documents-debug.apk downloads/build-verification.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'build: publish verified all documents APK [skip ci]'
            git push
          } else {
            Write-Host 'APK and report unchanged; nothing to commit.'
          }
