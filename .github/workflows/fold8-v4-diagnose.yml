name: Fold8 v4 Diagnose

on:
  push:
    branches: [com2-runner-probe-20260824]
    paths:
      - '.github/workflows/fold8-v4-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply patch
        shell: cmd
        continue-on-error: true
        run: |
          if not exist ci-proof mkdir ci-proof
          set "P=ci-proof\fold8-v4-stage-diagnose.txt"
          > "%P%" echo commit=${{ github.sha }}
          set "ROOT=C:\actions-runner\com2-dev"
          if exist "%ROOT%\fold8-work" rmdir /s /q "%ROOT%\fold8-work"
          mkdir "%ROOT%\fold8-work"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%ROOT%\fold8-source.zip' -DestinationPath '%ROOT%\fold8-work' -Force"
          echo extract_exit=%errorlevel%>>"%P%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File fold8-deploy\v4\apply-compile-fixes.ps1 -Root "%ROOT%\fold8-work" > "%ROOT%\patch.out" 2>&1
          echo patch_exit=%errorlevel%>>"%P%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$o=(Get-Content '%ROOT%\patch.out' -Raw).Replace([Environment]::NewLine,' | '); Add-Content '%P%' ('patch_output='+$o)"

      - name: Direct Gradle build diagnosis
        shell: cmd
        continue-on-error: true
        run: |
          set "P=ci-proof\fold8-v4-stage-diagnose.txt"
          set "ROOT=C:\actions-runner\com2-dev"
          set "JAVA_HOME=C:\actions-runner\runner-02\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-8\x64"
          set "ANDROID_HOME=C:\actions-runner\runner-03\_work\_tool\android-sdk-36"
          set "ANDROID_SDK_ROOT=C:\actions-runner\runner-03\_work\_tool\android-sdk-36"
          cd /d "%ROOT%\fold8-work"
          call "%ROOT%\gradle-9.1.0-dist\gradle-9.1.0\bin\gradle.bat" --no-daemon clean assembleDebug --stacktrace > "%ROOT%\direct-build.out" 2>&1
          echo gradle_build_exit=%errorlevel%>>"%GITHUB_WORKSPACE%\%P%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$o=(Get-Content '%ROOT%\direct-build.out' -Tail 120) -join ' | '; Add-Content '%GITHUB_WORKSPACE%\%P%' ('gradle_tail='+$o)"
          if exist "%ROOT%\fold8-work\app\build\outputs\apk\debug\app-debug.apk" (
            echo apk_exists=True>>"%GITHUB_WORKSPACE%\%P%"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$h=(Get-FileHash '%ROOT%\fold8-work\app\build\outputs\apk\debug\app-debug.apk' -Algorithm SHA256).Hash.ToLowerInvariant(); Add-Content '%GITHUB_WORKSPACE%\%P%' ('apk_sha256='+$h)"
          ) else (
            echo apk_exists=False>>"%GITHUB_WORKSPACE%\%P%"
          )

      - name: Publish diagnosis
        if: always()
        shell: cmd
        run: |
          type ci-proof\fold8-v4-stage-diagnose.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-proof\fold8-v4-stage-diagnose.txt
          git commit -m "ci: publish Fold8 build diagnosis" || exit /b 0
          git push origin HEAD:com2-runner-probe-20260824
