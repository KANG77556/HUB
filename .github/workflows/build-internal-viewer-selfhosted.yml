name: Build Internal Viewer Self-Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-source/**'
      - '.github/workflows/build-internal-viewer-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose local toolchain
        run: |
          echo === JAVA ===
          where java
          java -version
          echo JAVA_HOME=%JAVA_HOME%
          echo === NODE/NPM ===
          where node
          node --version
          where npm
          npm --version
          echo === GRADLE ===
          where gradle
          gradle --version
          echo === ANDROID ===
          echo ANDROID_HOME=%ANDROID_HOME%
          echo ANDROID_SDK_ROOT=%ANDROID_SDK_ROOT%
          where adb
          adb version
          where sdkmanager
          sdkmanager --version
          echo === PROJECT WRAPPER ===
          dir /b android-source
          if exist android-source\gradlew.bat call android-source\gradlew.bat --version
