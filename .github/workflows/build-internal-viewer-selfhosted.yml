name: Build Internal Viewer Self-Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-source/**'
      - '.github/workflows/build-internal-viewer-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose local toolchain
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== JAVA ==='
          where.exe java
          java -version
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host '=== NODE/NPM ==='
          where.exe node
          node --version
          where.exe npm
          npm --version
          Write-Host '=== GRADLE ==='
          where.exe gradle
          gradle --version
          Write-Host '=== ANDROID ==='
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          where.exe adb
          adb version
          where.exe sdkmanager
          sdkmanager --version
          Write-Host '=== PROJECT WRAPPER ==='
          Get-ChildItem 'android-source' -Name | Sort-Object
          if (Test-Path 'android-source/gradlew.bat') { & 'android-source/gradlew.bat' --version }
