name: Diagnose Legendary Forge APK PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-legendary-forge-apk-pr.yml'
      - 'legendary-forge-apk/settings.gradle'
      - 'legendary-forge-apk/build.gradle'
      - 'legendary-forge-apk/app/build.gradle'
      - 'legendary-forge-apk/app/src/main/**'
      - 'legendary-forge-apk/v020-bundle/**'

permissions:
  contents: write

concurrency:
  group: legendary-forge-apk-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify v0.2.0 embedded game asset
        shell: powershell
        run: |
          $partRoot = 'legendary-forge-apk\v020-bundle'
          $parts = @(Get-ChildItem -LiteralPath $partRoot -Filter 'part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 3) { throw "expected 3 bundle parts, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::ASCII) }) -join ''
          $gzBytes = [Convert]::FromBase64String($b64)
          $input = New-Object IO.MemoryStream(,$gzBytes)
          $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
          $output = New-Object IO.MemoryStream
          $gzip.CopyTo($output)
          $gzip.Dispose()
          $input.Dispose()
          $asset = 'legendary-forge-apk\app\src\main\assets\index.html'
          [IO.File]::WriteAllBytes($asset, $output.ToArray())
          $output.Dispose()
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          if ($hash -ne 'ce107df700e580334c3c8b1e307ebfa85c32744a372d30c107cf74e3f5c249d5') { throw "asset sha mismatch: $hash" }
          $html = [IO.File]::ReadAllText($asset, [Text.Encoding]::UTF8)
          if (-not $html.Contains('legendary-forge-apk-v2')) { throw 'v2 save marker missing' }
          Write-Host ('ASSET_SHA256=' + $hash)
          Write-Host ('ASSET_BYTES=' + (Get-Item $asset).Length)

      - name: Verify Android version contract
        run: |
          findstr /c:"applicationId 'com.seongho.legendaryforge'" legendary-forge-apk\app\build.gradle >nul || exit /b 21
          findstr /c:"versionCode 3" legendary-forge-apk\app\build.gradle >nul || exit /b 22
          findstr /c:"versionName '0.2.0'" legendary-forge-apk\app\build.gradle >nul || exit /b 23

      - name: Prepare pinned portable JDK 17
        run: |
          set "TOOLS=%RUNNER_TEMP%\legendary-forge-tools-pr"
          if exist "%TOOLS%" rmdir /s /q "%TOOLS%"
          mkdir "%TOOLS%"
          curl.exe -k -L --fail --retry 3 -o "%TOOLS%\jdk.zip" "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20+8/OpenJDK17U-jdk_x64_windows_hotspot_17.0.20_8.zip"
          certutil -hashfile "%TOOLS%\jdk.zip" SHA256 | findstr /i "418497be5cf585bdd2203d6486a565d66d3f5e992d5630d45104cb873fab8122" >nul || exit /b 11
          mkdir "%TOOLS%\jdk"
          tar -xf "%TOOLS%\jdk.zip" -C "%TOOLS%\jdk" --strip-components=1
          "%TOOLS%\jdk\bin\java.exe" -version

      - name: Prepare pinned Gradle 8.10.2
        run: |
          set "TOOLS=%RUNNER_TEMP%\legendary-forge-tools-pr"
          curl.exe -k -L --fail --retry 3 -o "%TOOLS%\gradle.zip" "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          certutil -hashfile "%TOOLS%\gradle.zip" SHA256 | findstr /i "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26" >nul || exit /b 12
          mkdir "%TOOLS%\gradle"
          tar -xf "%TOOLS%\gradle.zip" -C "%TOOLS%\gradle" --strip-components=1
          set "JAVA_HOME=%TOOLS%\jdk"
          set "PATH=%JAVA_HOME%\bin;%TOOLS%\gradle\bin;%PATH%"
          gradle --version

      - name: Build installable debug APK
        run: |
          set "TOOLS=%RUNNER_TEMP%\legendary-forge-tools-pr"
          set "JAVA_HOME=%TOOLS%\jdk"
          set "ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk"
          set "ANDROID_SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          set "PATH=%JAVA_HOME%\bin;%TOOLS%\gradle\bin;%ANDROID_HOME%\platform-tools;%PATH%"
          set "GRADLE_OPTS=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Dorg.gradle.daemon=false"
          if not exist "%ANDROID_HOME%\platforms\android-35\android.jar" exit /b 31
          gradle -p legendary-forge-apk --no-daemon assembleDebug

      - name: Verify APK signature package and version
        run: |
          setlocal EnableDelayedExpansion
          set "TOOLS=%RUNNER_TEMP%\legendary-forge-tools-pr"
          set "JAVA_HOME=!TOOLS!\jdk"
          set "PATH=!JAVA_HOME!\bin;!PATH!"
          set "APK=legendary-forge-apk\app\build\outputs\apk\debug\app-debug.apk"
          set "ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk"
          if not exist "!APK!" exit /b 41
          set "APKSIGNER="
          for /f "delims=" %%F in ('where /r "!ANDROID_HOME!\build-tools" apksigner.bat 2^>nul') do set "APKSIGNER=%%F"
          if not defined APKSIGNER exit /b 42
          call "!APKSIGNER!" verify --verbose --print-certs "!APK!" || exit /b 43
          set "AAPT="
          for /f "delims=" %%F in ('where /r "!ANDROID_HOME!\build-tools" aapt.exe 2^>nul') do set "AAPT=%%F"
          if not defined AAPT exit /b 44
          for /f "delims=" %%L in ('"!AAPT!" dump badging "!APK!" ^| findstr /b "package:"') do set "PKG=%%L"
          echo PACKAGE_BADGING=!PKG!
          echo(!PKG!| findstr /c:"name='com.seongho.legendaryforge'" >nul || exit /b 45
          echo(!PKG!| findstr /c:"versionCode='3'" >nul || exit /b 46
          echo(!PKG!| findstr /c:"versionName='0.2.0'" >nul || exit /b 47
          if not exist legendary-forge-apk\dist mkdir legendary-forge-apk\dist
          copy /y "!APK!" legendary-forge-apk\dist\LegendaryForge-0.2.0-debug.apk >nul
          powershell -NoProfile -Command "$h=(Get-FileHash -Algorithm SHA256 'legendary-forge-apk\dist\LegendaryForge-0.2.0-debug.apk').Hash.ToLower(); Set-Content -Encoding ASCII 'legendary-forge-apk\dist\LegendaryForge-0.2.0-debug.sha256.txt' $h; Write-Host ('APK_SHA256=' + $h); Write-Host ('APK_BYTES=' + (Get-Item 'legendary-forge-apk\dist\LegendaryForge-0.2.0-debug.apk').Length)"

      - name: Publish verified APK to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci/legendary-forge-apk-20260821
          git checkout -B ci/legendary-forge-apk-20260821 origin/ci/legendary-forge-apk-20260821
          git add -f legendary-forge-apk\dist\LegendaryForge-0.2.0-debug.apk legendary-forge-apk\dist\LegendaryForge-0.2.0-debug.sha256.txt
          git diff --cached --quiet && exit /b 0
          git commit -m "build: publish verified Legendary Forge 0.2.0 APK [skip ci]"
          git push origin HEAD:ci/legendary-forge-apk-20260821
