name: Fold8 v4 Build

on:
  push:
    branches: [com2-runner-probe-20260824]
    paths:
      - '.github/workflows/fold8-v4-build.yml'
      - 'fold8-deploy/v4/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and COM2
        shell: cmd
        run: |
          if not exist ci-proof mkdir ci-proof
          copy /b fold8-deploy\v4\fold8.b64.00+fold8-deploy\v4\fold8.b64.01+fold8-deploy\v4\fold8.b64.02+fold8-deploy\v4\fold8.b64.03+fold8-deploy\v4\fold8.b64.04+fold8-deploy\v4\fold8.b64.05 "%GITHUB_WORKSPACE%\fold8.b64"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "[IO.File]::WriteAllBytes('%GITHUB_WORKSPACE%\fold8-source.zip',[Convert]::FromBase64String([IO.File]::ReadAllText('%GITHUB_WORKSPACE%\fold8.b64')))"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$h=(Get-FileHash '%GITHUB_WORKSPACE%\fold8-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne '9ad5c170a10dc014382ca5f76f7002a45b1cfc237b097a46121c8354d71d2392'){exit 10}"
          if exist "%GITHUB_WORKSPACE%\fold8-work" rmdir /s /q "%GITHUB_WORKSPACE%\fold8-work"
          mkdir "%GITHUB_WORKSPACE%\fold8-work"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%GITHUB_WORKSPACE%\fold8-source.zip' -DestinationPath '%GITHUB_WORKSPACE%\fold8-work' -Force"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File fold8-deploy\v4\apply-compile-fixes.ps1 -Root "%GITHUB_WORKSPACE%\fold8-work"
          copy /b com2-deploy\jar.b64.00+com2-deploy\jar.b64.01+com2-deploy\jar.b64.02+com2-deploy\jar.b64.03+com2-deploy\jar.b64.04 "%GITHUB_WORKSPACE%\com2-jar.b64"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "[IO.File]::WriteAllBytes('%GITHUB_WORKSPACE%\COM2DevServer.jar',[Convert]::FromBase64String([IO.File]::ReadAllText('%GITHUB_WORKSPACE%\com2-jar.b64')))"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$h=(Get-FileHash '%GITHUB_WORKSPACE%\COM2DevServer.jar' -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne 'fe87a8b8b08b44b917cc6a98bec4f13c893679c6cf868e717c635d2c56645453'){exit 11}"

      - name: COM2 build and hash E2E
        shell: cmd
        run: |
          set "JAVA_HOME=C:\actions-runner\runner-02\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-8\x64"
          set "ANDROID_HOME=C:\actions-runner\runner-03\_work\_tool\android-sdk-36"
          set "ANDROID_SDK_ROOT=C:\actions-runner\runner-03\_work\_tool\android-sdk-36"
          set "COM2_BIND_HOST=127.0.0.1"
          set "COM2_PORT=8767"
          set "COM2_ALLOWED_ROOTS=%GITHUB_WORKSPACE%;C:\actions-runner\com2-dev"
          start "" /b "%JAVA_HOME%\bin\java.exe" -jar "%GITHUB_WORKSPACE%\COM2DevServer.jar" > "%GITHUB_WORKSPACE%\com2-build.log" 2>&1
          ping 127.0.0.1 -n 3 >nul
          curl.exe -fsS http://127.0.0.1:8767/healthz
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$body=@{jsonrpc='2.0';id=1;method='tools/call';params=@{name='run_command';arguments=@{command='C:\actions-runner\com2-dev\gradle-9.1.0-dist\gradle-9.1.0\bin\gradle.bat --no-daemon clean assembleDebug';working_directory='%GITHUB_WORKSPACE%\fold8-work';timeout_ms=900000}}}|ConvertTo-Json -Depth 8 -Compress; [IO.File]::WriteAllText('%GITHUB_WORKSPACE%\build-request.json',$body)"
          curl.exe -fsS -H "Content-Type: application/json" --data-binary "@%GITHUB_WORKSPACE%\build-request.json" http://127.0.0.1:8767/mcp > "%GITHUB_WORKSPACE%\build-response.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$r=Get-Content '%GITHUB_WORKSPACE%\build-response.json' -Raw|ConvertFrom-Json; if($r.error -or $r.result.isError){exit 13}; $inner=$r.result.content[0].text|ConvertFrom-Json; if($inner.exitCode -ne 0 -or $inner.timedOut){exit 14}"
          if not exist "%GITHUB_WORKSPACE%\fold8-work\app\build\outputs\apk\debug\app-debug.apk" exit /b 20
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$h=(Get-FileHash '%GITHUB_WORKSPACE%\fold8-work\app\build\outputs\apk\debug\app-debug.apk' -Algorithm SHA256).Hash.ToLowerInvariant(); [IO.File]::WriteAllText('%GITHUB_WORKSPACE%\apk.sha256.txt',$h); $body=@{jsonrpc='2.0';id=2;method='tools/call';params=@{name='get_file_hash';arguments=@{path='%GITHUB_WORKSPACE%\fold8-work\app\build\outputs\apk\debug\app-debug.apk';algorithm='SHA-256'}}}|ConvertTo-Json -Depth 8 -Compress; [IO.File]::WriteAllText('%GITHUB_WORKSPACE%\hash-request.json',$body)"
          curl.exe -fsS -H "Content-Type: application/json" --data-binary "@%GITHUB_WORKSPACE%\hash-request.json" http://127.0.0.1:8767/mcp > "%GITHUB_WORKSPACE%\hash-response.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$local=(Get-Content '%GITHUB_WORKSPACE%\apk.sha256.txt' -Raw).Trim(); $r=Get-Content '%GITHUB_WORKSPACE%\hash-response.json' -Raw|ConvertFrom-Json; if($r.error -or $r.result.isError){exit 21}; $inner=$r.result.content[0].text|ConvertFrom-Json; if($inner.hash -ne $local){Write-Error ('hash mismatch '+$inner.hash+' != '+$local); exit 22}; Write-Host ('COM2_E2E_HASH_OK='+$local)"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Fold8Launcher-alpha02-debug
          path: ${{ github.workspace }}\fold8-work\app\build\outputs\apk\debug\app-debug.apk
          retention-days: 7

      - name: Publish COM2 E2E proof
        if: always() && github.event_name == 'push'
        shell: cmd
        run: |
          echo commit=${{ github.sha }}> ci-proof\fold8-v4-build.txt
          echo job_status=${{ job.status }}>> ci-proof\fold8-v4-build.txt
          if exist "%GITHUB_WORKSPACE%\apk.sha256.txt" for /f "usebackq delims=" %%H in ("%GITHUB_WORKSPACE%\apk.sha256.txt") do echo apk_sha256=%%H>> ci-proof\fold8-v4-build.txt
          if exist "%GITHUB_WORKSPACE%\build-response.json" powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$s=(Get-Content '%GITHUB_WORKSPACE%\build-response.json' -Raw); Add-Content 'ci-proof\fold8-v4-build.txt' ('build_response='+$s)"
          if exist "%GITHUB_WORKSPACE%\hash-response.json" powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$s=(Get-Content '%GITHUB_WORKSPACE%\hash-response.json' -Raw); Add-Content 'ci-proof\fold8-v4-build.txt' ('hash_response='+$s)"
          if exist "%GITHUB_WORKSPACE%\com2-build.log" powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$s=(Get-Content '%GITHUB_WORKSPACE%\com2-build.log' -Tail 20)-join ' | '; Add-Content 'ci-proof\fold8-v4-build.txt' ('com2_log_tail='+$s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-proof\fold8-v4-build.txt
          git commit -m "ci: publish Fold8 COM2 same-step E2E proof" || exit /b 0
          git push origin HEAD:com2-runner-probe-20260824
