<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes">
<title>문서</title>
<style>
:root{--bg:#e9ebef;--paper:#fff;--gap:10px;--pad:4px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
#status{font-size:12px;padding:6px;text-align:center;color:#6b7280}
#status.ready{display:none}
#viewer{width:100%;padding:var(--pad);overflow-x:hidden}
.page-shell{width:100%;margin:0 auto var(--gap);display:flex;justify-content:center;align-items:flex-start}
.canvas-page{display:block;width:100%;height:auto;max-width:100%;background:var(--paper);border:1px solid rgba(17,24,39,.08);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.error{display:block!important;color:#b00020;white-space:pre-wrap;padding:12px!important}
</style>
</head>
<body>
<div id="status">문서를 준비하고 있습니다.</div>
<main id="viewer"></main>
<script>
const statusNode=document.getElementById('status');
function showStartupError(prefix,detail){statusNode.className='error';statusNode.textContent=`${prefix}\n${detail||'알 수 없는 오류'}`;}
window.addEventListener('error',e=>showStartupError('문서 표시 오류',e.message||e.error?.message));
window.addEventListener('unhandledrejection',e=>showStartupError('문서 처리 오류',e.reason?.message||String(e.reason)));
</script>
<script type="module">
import init,{HwpDocument} from './rhwp.js';
const status=document.getElementById('status');
const viewer=document.getElementById('viewer');
const measureCanvas=document.createElement('canvas');
const measureContext=measureCanvas.getContext('2d');
const FALLBACK_FONT='"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const BACKING_SCALE=1.5;
const MAX_RHWP_PAGES=80;
let runtimeReady,activeDocument=null;
function canvasFontForMeasurement(font){if(font&&String(font).trim())return font;return `10px ${FALLBACK_FONT}`;}
globalThis.measureTextWidth=(font,text)=>{if(!measureContext)return 0;measureContext.font=canvasFontForMeasurement(font);return measureContext.measureText(text??'').width;};
function base64ToBytes(base64){const binary=atob(base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;}
async function ensureRuntime(){if(!runtimeReady)runtimeReady=init({module_or_path:'./rhwp_bg.wasm'});await runtimeReady;}
function dispose(){if(activeDocument&&typeof activeDocument.free==='function')activeDocument.free();activeDocument=null;}
function createCanvasPage(){const shell=document.createElement('section');shell.className='page-shell';const canvas=document.createElement('canvas');canvas.className='canvas-page';canvas.width=1;canvas.height=1;shell.appendChild(canvas);viewer.appendChild(shell);return canvas;}
async function paintPage(pageIndex){const canvas=createCanvasPage();const result=activeDocument.renderPageToCanvas(pageIndex,canvas,BACKING_SCALE);if(result&&typeof result.then==='function')await result;if(canvas.width<=1||canvas.height<=1)throw new Error(`${pageIndex+1}쪽 Canvas 크기를 계산하지 못했습니다.`);canvas.style.aspectRatio=`${canvas.width} / ${canvas.height}`;canvas.style.width='100%';canvas.style.height='auto';await new Promise(resolve=>requestAnimationFrame(resolve));}
async function renderDocument(base64){status.className='';status.textContent='문서를 불러오는 중입니다.';viewer.replaceChildren();try{await ensureRuntime();if(document.fonts?.ready)await document.fonts.ready;dispose();activeDocument=new HwpDocument(base64ToBytes(base64));const count=activeDocument.pageCount();if(!Number.isFinite(count)||count<1)throw new Error('표시할 페이지가 없습니다.');if(count>MAX_RHWP_PAGES)throw new Error(`보안을 위해 HWP/HWPX는 최대 ${MAX_RHWP_PAGES}쪽까지 열 수 있습니다.`);for(let i=0;i<count;i++){status.textContent=`문서를 표시하는 중입니다. ${i+1}/${count}`;await paintPage(i);}status.textContent='';status.className='ready';}catch(error){dispose();status.className='error';status.textContent=`HWP/HWPX 문서를 표시할 수 없습니다.\n${error?.message||error}`;viewer.replaceChildren();}}
window.openRhwpFromBase64=renderDocument;window.addEventListener('beforeunload',dispose);status.textContent='문서를 기다리고 있습니다.';
</script>
</body>
</html>
